name: Build Ubuntu 26.04 packages and publish to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: icdesign-pages
  cancel-in-progress: false

jobs:
  build:
    # The runner hosts Docker; shared/Dockerfile selects the target Ubuntu release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build packages enabled in build-control.json
        env:
          MAINTAINER: "Mario Auer <mario.auer@tugraz.at>"
        run: python3 scripts/build.py --maintainer "$MAINTAINER"
      - name: Prepare site (retain disabled packages from previous publication)
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 scripts/prepare_site.py --previous-url "$PAGES_URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
